<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancelar inscrição - PulseTech</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 32px;
      letter-spacing: -0.5px;
    }

    .icone {
      font-size: 48px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      color: #1a1a2e;
      margin-bottom: 12px;
      font-weight: 700;
    }

    p {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: #3b5bdb;
      color: white;
    }

    .btn-primary:hover {
      background: #2f4ac0;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #3b5bdb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .estado-carregando .icone,
    .estado-carregando h1,
    .estado-carregando p,
    .estado-carregando .btn { display: none; }

    .estado-sucesso .spinner,
    .estado-erro .spinner { display: none; }

    .estado-sucesso .icone { content: '✅'; }
    .estado-erro .icone { content: '❌'; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">PulseNewsTech</div>

    <div id="conteudo" class="estado-carregando">
      <div class="spinner"></div>
      <div class="icone" id="icone"></div>
      <h1 id="titulo"></h1>
      <p id="descricao">Processando sua solicitação...</p>
      <a href="index.html" class="btn btn-primary" id="botao" style="display:none">Voltar ao início</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const conteudo = document.getElementById('conteudo');
    const icone = document.getElementById('icone');
    const titulo = document.getElementById('titulo');
    const descricao = document.getElementById('descricao');
    const botao = document.getElementById('botao');

    function mostrarResultado(sucesso, tituloTexto, descricaoTexto) {
      conteudo.className = sucesso ? 'estado-sucesso' : 'estado-erro';
      icone.textContent = sucesso ? '✅' : '❌';
      titulo.textContent = tituloTexto;
      descricao.textContent = descricaoTexto;
      botao.style.display = 'inline-block';
    }

    if (!token) {
      mostrarResultado(false, 'Link inválido', 'Este link de cancelamento não é válido. Verifique o email que você recebeu.');
    } else {
      fetch(`http://localhost:3000/cancelar?token=${token}`)
        .then(res => res.json().then(data => ({ ok: res.ok, data })))
        .then(({ ok, data }) => {
          if (ok) {
            mostrarResultado(true, 'Inscrição cancelada', 'Você foi removido da nossa lista. Sentiremos sua falta! Pode se inscrever novamente a qualquer momento.');
          } else {
            mostrarResultado(false, 'Link já utilizado', data.mensagem || 'Este link já foi usado ou é inválido.');
          }
        })
        .catch(() => {
          mostrarResultado(false, 'Erro inesperado', 'Não foi possível processar sua solicitação. Tente novamente em instantes.');
        });
    }
  </script>
</body>
</html>
